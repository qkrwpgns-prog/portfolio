<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S-LIFE | 삼성화재 갓생케어</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* [DESIGN SYSTEM] SAMSUNG One UI 7.0 Theme */
        :root {
            --ss-navy: #0054A6;    --ss-blue: #007EE5;    --ss-light: #F0F6FF;
            --ss-bg: #F4F7FA;      --ss-text-01: #1D1D1F; --ss-text-02: #4E5968;
            --ss-border: #E5E9EF;  --ss-error: #FF3B30;   --white: #FFFFFF;
            --shadow-premium: 0 15px 40px rgba(0, 84, 166, 0.12);
        }

        /* 텍스트 겹침 방지 및 부드러운 스크롤 */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: #DDE2E9; display: flex; justify-content: center; min-height: 100vh; overflow: hidden; }

        .app-frame {
            width: 100%; max-width: 430px; height: 100vh; background: var(--ss-bg);
            position: relative; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 50px 100px rgba(0,0,0,0.3);
        }

        /* [1] 프리미엄 온보딩 */
        #onboarding {
            position: absolute; inset: 0; background: var(--white); z-index: 9999;
            padding: 100px 35px 50px; display: flex; flex-direction: column;
            transition: transform 0.7s cubic-bezier(0.86, 0, 0.07, 1);
        }
        .ob-headline { font-size: 34px; font-weight: 900; color: var(--ss-navy); line-height: 1.3; margin-bottom: 60px; letter-spacing: -2px; }
        .ob-label { font-size: 14px; font-weight: 700; color: var(--ss-text-02); margin-bottom: 12px; }
        .ob-input { width: 100%; padding: 18px 0; border: none; border-bottom: 3.5px solid var(--ss-border); font-size: 26px; font-weight: 700; outline: none; color: var(--ss-navy); margin-bottom: 40px; transition: 0.3s; }
        .ob-input:focus { border-bottom-color: var(--ss-blue); }
        .gender-grid { display: flex; gap: 15px; margin-bottom: 60px; }
        .gender-card { flex: 1; padding: 25px; border-radius: 20px; border: 1.5px solid var(--ss-border); background: white; text-align: center; font-weight: 800; color: #ADB5BD; cursor: pointer; transition: 0.3s; }
        .gender-card.active { border-color: var(--ss-navy); color: var(--ss-navy); background: var(--ss-light); box-shadow: 0 10px 20px rgba(0,84,166,0.05); }
        .btn-start { width: 100%; padding: 24px; border-radius: 20px; background: var(--ss-blue); color: white; border: none; font-size: 19px; font-weight: 800; cursor: pointer; box-shadow: 0 15px 30px rgba(0, 126, 229, 0.3); margin-top: auto; }

        /* [2] 상단 디자인 헤더 */
        header { background: var(--white); padding: 22px 28px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--ss-border); z-index: 100; }
        header h1 { color: var(--ss-navy); font-size: 24px; font-weight: 950; letter-spacing: -1.5px; }

        /* [3] 메인 스크롤 콘텐츠 */
        main { flex: 1; overflow-y: auto; padding-bottom: 280px; position: relative; scroll-behavior: smooth; }
        .page { display: none; padding: 28px; }
        .page.active { display: block; animation: pageAnim 0.6s both; }
        @keyframes pageAnim { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* 포인트 리워드 보드 */
        .dash-board {
            background: linear-gradient(135deg, #00468C, #007EE5); border-radius: 32px;
            padding: 40px 28px; color: white; margin-bottom: 35px; box-shadow: var(--shadow-premium);
            position: relative; overflow: hidden;
        }
        .dash-board p { font-size: 15px; opacity: 0.8; margin-bottom: 10px; font-weight: 500; }
        .dash-board h2 { font-size: 42px; font-weight: 900; letter-spacing: -2px; }

        /* [4] 보험 블록 카드 리스트 */
        .insurance-card {
            background: var(--white); border-radius: 32px; padding: 28px; margin-bottom: 20px;
            border: 2px solid transparent; cursor: pointer; transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); position: relative;
        }
        .insurance-card.selected { border-color: var(--ss-blue); background: var(--ss-sky); transform: scale(1.03); }
        .insurance-card h4 { font-size: 21px; font-weight: 900; color: var(--ss-navy); margin-bottom: 10px; }
        
        /* 사회적 증거 그래프 (누르면 노출) */
        .peer-graph { margin-top: 20px; border-top: 1.5px solid #E9F0F8; padding-top: 20px; display: none; }
        .insurance-card.selected .peer-graph { display: block; animation: slideDown 0.5s both; }
        @keyframes slideDown { from { opacity: 0; height: 0; } to { opacity: 1; height: auto; } }
        .label-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--ss-blue); margin-bottom: 10px; }
        .track { width: 100%; height: 9px; background: #E5E9EF; border-radius: 10px; overflow: hidden; }
        .bar { height: 100%; background: var(--ss-blue); width: 0%; transition: width 1.3s ease-in-out; }

        /* [5] 하단 리얼타임 결제 도크 */
        .pay-dock {
            position: absolute; bottom: 85px; width: 100%; background: var(--ss-navy);
            padding: 30px 35px; color: white; display: none; border-radius: 35px 35px 0 0;
            z-index: 1000; box-shadow: 0 -15px 50px rgba(0, 0, 0, 0.2);
        }
        .pay-dock.active { display: block; animation: dockUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
        @keyframes dockUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .pay-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sale-badge { background: var(--ss-error); padding: 5px 12px; border-radius: 10px; font-size: 13px; font-weight: 900; }

        /* [6] 약관 번역기 모달 & 서식 처리 */
        .full-modal { position: absolute; inset: 0; background: var(--white); z-index: 6000; display: none; flex-direction: column; }
        .modal-body { flex: 1; overflow-y: auto; padding: 0 30px 150px; }
        
        .trans-toggle-bar {
            display: flex; background: #F4F6F9; padding: 6px; border-radius: 18px; margin: 30px 0;
            position: sticky; top: 0; z-index: 10;
        }
        .toggle-item { flex: 1; padding: 16px; border: none; border-radius: 14px; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.3s; color: #9BA5B1; background: none; }
        .toggle-item.active { background: var(--white); color: var(--ss-navy); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        .policy-unit { margin-bottom: 50px; padding-bottom: 30px; border-bottom: 2px solid #F8F9FA; }
        .policy-unit h5 { font-size: 20px; color: var(--ss-navy); margin-bottom: 20px; border-left: 6px solid var(--ss-navy); padding-left: 15px; }
        .policy-text { white-space: pre-wrap; font-size: 16.5px; line-height: 1.9; color: var(--ss-text-02); word-break: keep-all; }
        .policy-text b { color: var(--ss-navy); font-weight: 900; text-decoration: underline; text-underline-offset: 5px; }
        .policy-text mark { background: #FFEB3B; padding: 2px 6px; border-radius: 5px; font-weight: 800; }
        .easy-style { color: var(--ss-blue) !important; font-weight: 700; }

        /* [7] AI 상담원 디자인 */
        .chat-wrap { height: 450px; background: var(--white); border-radius: 28px; border: 1px solid var(--ss-border); padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; }
        .msg-line { display: flex; width: 100%; }
        .msg-line.ai { justify-content: flex-start; }
        .msg-line.me { justify-content: flex-end; }
        .bubble { max-width: 85%; padding: 18px 24px; border-radius: 24px; font-size: 16px; line-height: 1.7; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .ai .bubble { background: var(--ss-sky); color: var(--ss-navy); border-top-left-radius: 4px; }
        .me .bubble { background: var(--ss-navy); color: var(--white); border-top-right-radius: 4px; }

        /* [8] 하단 내비게이션 */
        nav { position: absolute; bottom: 0; width: 100%; height: 95px; background: var(--white); border-top: 1px solid var(--ss-border); display: flex; justify-content: space-around; padding-bottom: 30px; }
        .nav-item { flex: 1; text-align: center; color: #CFD7E0; padding-top: 22px; cursor: pointer; transition: 0.2s; }
        .nav-item.active { color: var(--ss-navy); }
        .nav-item i { font-size: 26px; margin-bottom: 8px; }

        .btn-primary { width: 100%; padding: 22px; background: var(--ss-blue); color: white; border: none; border-radius: 18px; font-size: 19px; font-weight: 800; cursor: pointer; transition: 0.2s; }
    </style>
</head>
<body>

<div class="app-frame">
    <div id="onboarding">
        <h2 class="ob-headline">더 똑똑한 보험 관리,<br>삼성 S-LIFE가 시작할게요. 🌱</h2>
        <p class="ob-label">고객님의 나이</p>
        <input type="number" id="userAge" class="ob-input" placeholder="예: 28">
        <p class="ob-label">성별을 선택해주세요</p>
        <div class="gender-grid">
            <div id="gMale" class="gender-card" onclick="setGender('Male')">남성</div>
            <div id="gFemale" class="gender-card" onclick="setGender('Female')">여성</div>
        </div>
        <button class="btn-primary" onclick="startApp()">분석 시작하기</button>
    </div>

    <header><h1>SAMSUNG <span>S-LIFE</span></h1><i class="fa-solid fa-bars" style="color:#DDD"></i></header>

    <main id="mainContent">
        <div id="homePage" class="page active">
            <div class="dash-board">
                <p>이번 달 적립 포인트</p>
                <h2 id="pViewDisplay">15,400 P</h2>
            </div>
            <h3 style="font-size:20px; font-weight:900; margin-bottom:20px;">건강 관리 미션 🏃</h3>
            <div id="missionListArea">
                <p style="text-align:center; padding:60px; color:#BBB; font-size:16px;">보험에 가입하고 갓생 미션을 시작해보세요!</p>
            </div>
        </div>
        <div id="shopPage" class="page">
            <h3 style="font-size:22px; font-weight:900; margin-bottom:10px;">보험 블록 쇼핑</h3>
            <p style="font-size:15px; color:var(--ss-text-02); margin-bottom:30px;">원하는 보장을 선택하면 실시간 할인이 적용됩니다.</p>
            <div id="insuranceContainer"></div>
        </div>
        <div id="aiPage" class="page">
            <h3 style="font-size:22px; font-weight:900; margin-bottom:25px;">AI 건강 상담소 🤖</h3>
            <div id="chatBoxArea" class="chat-wrap">
                <div class="msg-line ai"><div class="bubble">안녕하세요! 삼성화재 AI입니다. 증상을 말씀해 주시면 딱 맞는 보장을 추천해 드려요.</div></div>
            </div>
            <div style="display:flex; gap:12px; margin-top:15px;">
                <input type="text" id="aiInputText" style="flex:1; padding:20px; border-radius:18px; border:1px solid #EEE; outline:none; font-size:16px;" placeholder="증상을 입력하세요">
                <button onclick="askAI()" style="width:70px; border-radius:18px; border:none; background:var(--ss-navy); color:white; font-size:22px;"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </main>

    <div id="priceDockBar" class="pay-dock">
        <div class="pay-row">
            <span id="selLabelCount" style="font-weight:800; font-size:16px;">0개 보장 선택됨</span>
            <span id="discountBadgeTag" class="sale-badge" style="display:none;">번들 할인 0%</span>
        </div>
        <div class="pay-row" style="margin-bottom:30px;">
            <span style="opacity:0.8; font-size:17px;">최종 월 구독료</span>
            <h2 id="finalPriceDisplayView" style="font-size:32px; font-weight:900;">0원</h2>
        </div>
        <button class="btn-primary" style="background:var(--ss-blue);" onclick="openPolicyModal()">약관 번역 확인 및 가입하기</button>
    </div>

    <div id="policyModalLayer" class="full-modal">
        <div style="padding:22px 28px; border-bottom:1px solid #eee; display:flex; align-items:center;">
            <i class="fa-solid fa-chevron-left" style="font-size:24px; cursor:pointer;" onclick="closePolicyModal()"></i>
            <b style="font-size:20px; flex:1; text-align:center; margin-right:24px;">통합 약관 번역</b>
        </div>
        <div class="modal-body">
            <div class="trans-toggle-bar">
                <button id="stdBtnTab" class="toggle-item active" onclick="setPolicyMode('std')">표준 약관</button>
                <button id="easyBtnTab" class="toggle-item" onclick="setPolicyMode('easy')">✨ 일상 언어 번역</button>
            </div>
            <div id="policyContainerList"></div>
        </div>
        <div style="position:absolute; bottom:0; width:100%; padding:30px; background:white; border-top:1.5px solid #EEE;"><button class="btn-primary" onclick="confirmFinalJoin()">가입 확정하기</button></div>
    </div>

    <nav>
        <div class="nav-item active" onclick="changePage('homePage', this)"><i class="fa-solid fa-house"></i><p>홈</p></div>
        <div class="nav-item" onclick="changePage('shopPage', this)"><i class="fa-solid fa-cubes"></i><p>블록</p></div>
        <div class="nav-item" onclick="changePage('aiPage', this)"><i class="fa-solid fa-headset"></i><p>상담</p></div>
    </nav>
</div>

<script>
    // 🔗 백엔드 링크 (요청하신 새 주소로 변경됨)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx4GxOZuTs2Bqr0ONls-59pHXZeAhEoUdIKSTLbz2O2L2An-fKIn6aOE8JW-C3YOkxqMw/exec";
    
    let state = {
        user: { age: 26, gender: 'Male', points: 15400 },
        products: [
            { ID: "1", Title: "거북목 케어", SimpleName: "스마트폰 장시간 사용 방어", Price: 3500, MaleRate: 75, FemaleRate: 85, Guide: "목 스트레칭 2회 수행", Discount: 2000, StandardTerms: "**제1조 (보장 내용)**\n경추부 염좌 진단 시 보험금 지급.\n(최초 1회 한함)", EasyTerms: "스마트폰 보다가 목 아파서 ==병원 가면==\n치료비를 {c:blue}전액{/c} 챙겨드려요!" },
            { ID: "2", Title: "위장 튼튼", SimpleName: "자극적인 식습관 케어", Price: 2800, MaleRate: 80, FemaleRate: 82, Guide: "식단 기록 1회 업로드", Discount: 1500, StandardTerms: "급성 위염 진단 시 가입금액 지급.", EasyTerms: "매운 거 먹고 속 쓰릴 때\n삼성화재가 병원비 도와드려요." }
        ],
        selectedIds: [],
        joined: []
    };

    // [1] 서식 처리 엔진
    function richText(txt) {
        if(!txt) return "준비 중";
        return txt.toString().replace(/\\n/g, '\n').replace(/\n/g, '<br>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/==(.*?)==/g, '<mark>$1</mark>')
            .replace(/\{c:blue\}(.*?)\{\/c\}/g, '<span style="color:var(--ss-blue); font-weight:800;">$1</span>');
    }

    // [2] 온보딩
    function setGender(g) { state.user.gender = g; document.getElementById('gMale').className = g==='Male'?'gender-card active':'gender-card'; document.getElementById('gFemale').className = g==='Female'?'gender-card active':'gender-card'; }
    function startApp() { const age = document.getElementById('userAge').value; if(!age) return alert("나이를 입력하세요"); state.user.age = age; document.getElementById('onboarding').style.transform = "translateY(-100%)"; loadInitialData(); }
    
    async function loadInitialData() {
        renderShopList();
        try {
            const res = await fetch(`${SCRIPT_URL}?age=${Math.floor(state.user.age/10)*10}&action=get_data`);
            const data = await res.json();
            if(data && data.length > 0) { state.products = data; renderShopList(); }
        } catch(e) { console.warn("Mock Mode Active"); }
    }

    // [3] 상품 리스트 & 그래프
    function renderShopList() {
        const container = document.getElementById('insuranceContainer'); container.innerHTML = "";
        state.products.forEach(p => {
            const isSelected = state.selectedIds.includes(p.ID);
            const rate = state.user.gender === 'Male' ? p.MaleRate : p.FemaleRate;
            const div = document.createElement('div');
            div.className = `insurance-card ${isSelected ? 'selected' : ''}`;
            div.onclick = () => { toggleSelectItem(p.ID); };
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between;"><h4>${p.Title}</h4><i class="fa-solid fa-circle-check" style="color:${isSelected?'var(--ss-blue)':'#EEE'}; font-size:24px;"></i></div>
                <p style="font-size:15px; color:var(--ss-text-02); margin-top:5px;">${p.SimpleName}</p>
                <div class="peer-graph">
                    <div class="label-row"><span>또래 가입률</span><b>${rate}%</b></div>
                    <div class="track"><div class="bar" style="width:${isSelected?rate:0}%"></div></div>
                </div>
                <div style="margin-top:18px; font-weight:900; color:var(--ss-navy); font-size:18px;">월 ${parseInt(p.Price || 5000).toLocaleString()}원</div>
            `;
            container.appendChild(div);
        });
    }

    function toggleSelectItem(id) {
        if(state.selectedIds.includes(id)) state.selectedIds = state.selectedIds.filter(x=>x!==id);
        else state.selectedIds.push(id);
        renderShopList(); updateBottomDock();
    }

    function updateBottomDock() {
        const dock = document.getElementById('priceDockBar'); const badge = document.getElementById('discountBadgeTag');
        if(state.selectedIds.length > 0) dock.className = "pay-dock active"; else { dock.className = "pay-dock"; return; }
        let total = 0; state.selectedIds.forEach(id => total += parseInt(state.products.find(p => p.ID == id).Price || 5000));
        let disc = state.selectedIds.length >= 3 ? 0.9 : (state.selectedIds.length >= 2 ? 0.95 : 1);
        badge.style.display = disc < 1 ? "inline-block" : "none"; badge.innerText = `번들 할인 ${Math.round((1-disc)*100)}% 적용`;
        document.getElementById('selLabelCount').innerText = `${state.selectedIds.length}개 보장 선택됨`;
        document.getElementById('finalPriceDisplayView').innerText = Math.floor(total * disc).toLocaleString() + "원";
    }

    // [4] AI 상담 (에러 핸들링 및 디버깅 강화)
    async function askAI() {
        const input = document.getElementById('aiInputText'); 
        const box = document.getElementById('chatBoxArea');
        if(!input.value.trim()) return;
        
        const msg = input.value; 
        input.value = "";
        
        box.innerHTML += `<div class="msg-line me"><div class="bubble">${msg}</div></div>`;
        box.scrollTop = box.scrollHeight;
        
        const loading = document.createElement('div'); 
        loading.className = "msg-line ai"; 
        loading.innerHTML = `<div class="bubble">삼성 AI가 고민을 분석 중입니다...</div>`;
        box.appendChild(loading);

        try {
            // GET 방식으로 요청을 보냄 (CORS 및 보안 회피)
            const res = await fetch(`${SCRIPT_URL}?action=chat&message=${encodeURIComponent(msg)}`);
            
            // 곧바로 JSON 파싱을 시도하다 에러가 나는 것을 방지하기 위해 텍스트로 먼저 받아봄
            const rawText = await res.text(); 
            
            // 문제가 지속되면 아래 주석을 풀고 F12 콘솔창에서 서버가 뭐라고 답변했는지 확인해보면 됨
            // console.log("서버 응답 원본:", rawText); 

            const data = JSON.parse(rawText);
            
            // 서버에서 전달한 답변(정상 답변이든 에러 메시지든)을 화면에 출력
            loading.querySelector('.bubble').innerText = data.reply || "답변을 생성하지 못했습니다.";
            
        } catch(e) {
            console.error("AI 연결 중 프론트엔드 에러 발생:", e);
            loading.querySelector('.bubble').innerHTML = "<b>[시뮬레이션 응답]</b><br>증상을 보니 '거북목 케어'와 '위장 튼튼' 블록을 추천드려요. 현재 또래 85%가 함께 가입 중입니다.";
        }
        
        box.scrollTop = box.scrollHeight;
    }

    function setPolicyMode(mode) {
        document.getElementById('stdBtnTab').className = mode==='std'?'toggle-item active':'toggle-item'; document.getElementById('easyBtnTab').className = mode==='easy'?'toggle-item active':'toggle-item';
        const list = document.getElementById('policyContainerList'); list.innerHTML = "";
        state.selectedIds.forEach(id => {
            const p = state.products.find(x => x.ID == id);
            list.innerHTML += `<div class="policy-unit"><h5>[${p.Title}]</h5><div class="policy-text ${mode==='easy'?'easy-style':''}">${richText(mode==='std'?p.StandardTerms:p.EasyTerms)}</div></div>`;
        });
    }

    function openPolicyModal() { document.getElementById('policyModalLayer').style.display = 'flex'; setPolicyMode('std'); }
    function closePolicyModal() { document.getElementById('policyModalLayer').style.display = 'none'; }
    function confirmFinalJoin() { alert("삼성 S-LIFE 가입을 환영합니다!"); state.selectedIds.forEach(id => state.joined.push(state.products.find(p => p.ID == id))); state.selectedIds = []; updateBottomDock(); renderMissionsDisplay(); closePolicyModal(); changePage('homePage', document.querySelectorAll('.nav-item')[0]); }
    
    function renderMissionsDisplay() {
        const list = document.getElementById('missionListArea'); list.innerHTML = "";
        state.joined.forEach(p => {
            list.innerHTML += `<div class="insurance-card" style="cursor:default;"><b>${p.Title} 챌린지</b><p style="font-size:14px; color:#666; margin:10px 0;">${p.Guide}</p><button class="btn-primary" style="padding:15px; font-size:14px;" onclick="alert('인증 완료')">포인트 받기</button></div>`;
        });
    }
    
    function changePage(id, el) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); el.classList.add('active'); }
</script>
</body>
</html>
